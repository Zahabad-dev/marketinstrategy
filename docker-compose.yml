version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: marketinstrategy_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: marketinstrategy
      MYSQL_USER: marketuser
      MYSQL_PASSWORD: marketpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - marketinstrategy_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketinstrategy_backend
    environment:
      FLASK_ENV: development
      DATABASE_URL: mysql+pymysql://marketuser:marketpass@mysql:3306/marketinstrategy
      SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - marketinstrategy_network
    command: python run.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketinstrategy_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - marketinstrategy_network
    command: npm run dev -- --host

volumes:
  mysql_data:

networks:
  marketinstrategy_network:
    driver: bridge
